<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 Hacking Projects Tracker</title>
  <style>
    :root {
      --bg: #0b0f0d;
      --panel: #111715;
      --panel-2: #151c19;
      --text: #e8efe9;
      --muted: #95a39a;
      --line: #243029;
      --green: #3aa8ff;
      --green-2: #1d7fe0;
      --blue: #3aa8ff;
      --orange: #ff8b5e;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { min-height: 100vh; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom: 28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.02em; }
    .brand-badge { width: 36px; height:36px; border-radius:12px; background:linear-gradient(135deg, rgba(58,168,255,.25), rgba(29,127,224,.08)); border:1px solid rgba(58,168,255,.2); display:grid; place-items:center; color:var(--green); }
    .brand small { display:block; color:var(--muted); font-weight:500; }
    .hero { display:grid; grid-template-columns: 1.4fr .8fr; gap:24px; align-items:stretch; margin-bottom:24px; }
    .card { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .hero-main { padding: 28px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; color:var(--green); background:rgba(58,168,255,.08); border:1px solid rgba(58,168,255,.18); border-radius:999px; padding:8px 12px; font-size:13px; margin-bottom:18px; }
    h1 { font-size: clamp(2.2rem, 4vw, 4.4rem); line-height: 1; margin: 0 0 14px; letter-spacing: -.04em; }
    h1 .accent { color: var(--green); }
    .lede { color: var(--muted); font-size: 1.08rem; line-height:1.7; max-width: 62ch; }
    .stats { display:flex; gap:28px; flex-wrap:wrap; margin-top:24px; }
    .stat .num { font-size:2rem; font-weight:800; color:var(--green); line-height:1; }
    .stat .label { color: var(--muted); font-size:.92rem; margin-top:4px; }
    .hero-side { padding: 28px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
    .ring { width: 158px; height: 158px; border-radius:50%; background: conic-gradient(var(--green) 0deg, rgba(255,255,255,.06) 0deg); display:grid; place-items:center; position:relative; margin-bottom:18px; }
    .ring::after { content:""; position:absolute; inset:10px; border-radius:50%; background: var(--panel); border:1px solid var(--line); }
    .ring-inner { position:relative; z-index:1; }
    .ring-value { font-size: 2rem; font-weight: 800; color: var(--green); }
    .ring-label { color: var(--muted); font-size: .9rem; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin: 18px 0 24px; }
    .search { flex:1 1 320px; }
    .search input, .notes textarea { width:100%; background:#0f1412; color:var(--text); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:1rem; outline:none; }
    .search input:focus, .notes textarea:focus { border-color: rgba(58,168,255,.45); box-shadow: 0 0 0 3px rgba(58,168,255,.12); }
    .filters { display:flex; gap:10px; flex-wrap:wrap; }
    .chip { border:1px solid var(--line); background: #101512; color: var(--muted); padding:10px 14px; border-radius:999px; cursor:pointer; }
    .chip.active { color: var(--green); border-color: rgba(58,168,255,.32); background: rgba(58,168,255,.08); }
    .section { margin-top: 24px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
    .section-title { display:flex; align-items:center; gap:12px; margin:0; font-size: 1.7rem; }
    .pill { font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; padding:7px 10px; border-radius:999px; }
    .pill.beginner { color:#ffd8ca; background: rgba(255,139,94,.14); border:1px solid rgba(255,139,94,.3); }
    .pill.intermediate { color:#cde7ff; background: rgba(58,168,255,.12); border:1px solid rgba(58,168,255,.28); }
    .count { color: var(--muted); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap:16px; }
    .project { padding:18px; position:relative; overflow:hidden; }
    .project.done { border-color: rgba(58,168,255,.36); box-shadow: 0 0 0 1px rgba(58,168,255,.08) inset, var(--shadow); }
    .project-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:10px; }
    .project-id { color: var(--muted); font-weight:700; font-size:.9rem; }
    .check { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color: transparent; background:#0f1412; }
    .project.done .check { color: var(--bg); background: var(--green); border-color: transparent; }
    .project h3 { margin:0 0 8px; font-size: 1.12rem; line-height:1.35; }
    .project p { margin:0 0 14px; color: var(--muted); line-height:1.6; min-height: 74px; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .tag { font-size:.78rem; color:#c7d5cc; background:#0c1110; border:1px solid var(--line); border-radius:999px; padding:6px 9px; }
    .actions { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .btn { cursor:pointer; border:none; border-radius:12px; padding:10px 12px; font-weight:700; }
    .btn-primary { background: linear-gradient(135deg, var(--green), var(--green-2)); color:#031a2b; }
    .btn-secondary { background:#0f1412; color:var(--text); border:1px solid var(--line); }
    .empty { color: var(--muted); padding: 16px 4px; }
    .modal-backdrop { position:fixed; inset:0; background: rgba(4,7,6,.72); display:none; align-items:center; justify-content:center; padding:20px; z-index: 1000; }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(860px, 100%); max-height:90vh; overflow:auto; padding:24px; }
    .modal h2 { margin:0 0 8px; font-size: 1.8rem; }
    .meta { color:var(--muted); margin-bottom:18px; }
    .modal-grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
    .box { background:#0d1210; border:1px solid var(--line); border-radius:16px; padding:16px; }
    .box h4 { margin:0 0 10px; }
    .box ul { margin:0; padding-left:18px; color:var(--muted); }
    .box li { margin: 0 0 8px; }
    .notes { margin-top:20px; }
    .notes textarea { min-height: 130px; resize: vertical; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
    footer { margin-top: 34px; color: var(--muted); text-align:center; font-size:.92rem; }
    @media (max-width: 920px) {
      .hero { grid-template-columns: 1fr; }
      .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
