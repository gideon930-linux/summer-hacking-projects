<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethernaut CTF Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem; --space-20: 5rem;
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-full: 9999px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

[data-theme="dark"] {
  --bg: #0d0f0e;
  --surface: #131714;
  --surface-2: #181c19;
  --surface-3: #1e231f;
  --border: #2a302b;
  --divider: #222824;
  --text: #d4d8d5;
  --text-muted: #7a8478;
  --text-faint: #4a524d;
  --text-inverse: #0d0f0e;
  --primary: #00e676;
  --primary-dim: #00b85a;
  --primary-glow: rgba(0,230,118,0.12);
  --primary-border: rgba(0,230,118,0.25);
  --red: #ff4444;
  --red-dim: #cc2222;
  --red-glow: rgba(255,68,68,0.12);
  --red-border: rgba(255,68,68,0.25);
  --gold: #fbbf24;
  --gold-glow: rgba(251,191,36,0.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
}

[data-theme="light"] {
  --bg: #f4f7f4;
  --surface: #ffffff;
  --surface-2: #f9fbf9;
  --surface-3: #eef2ee;
  --border: #d0d8d2;
  --divider: #e0e8e2;
  --text: #1a2e1e;
  --text-muted: #5a6e5e;
  --text-faint: #9ab09e;
  --text-inverse: #ffffff;
  --primary: #1a7a3c;
  --primary-dim: #0f5a2a;
  --primary-glow: rgba(26,122,60,0.08);
  --primary-border: rgba(26,122,60,0.2);
  --red: #dc2626;
  --red-dim: #991b1b;
  --red-glow: rgba(220,38,38,0.08);
  --red-border: rgba(220,38,38,0.2);
  --gold: #d97706;
  --gold-glow: rgba(217,119,6,0.1);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--text);
  background: var(--bg);
  transition: background var(--transition), color var(--transition);
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4) var(--space-6);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-4);
}
.header-brand { display: flex; align-items: center; gap: var(--space-3); }
.header-logo {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
}
.header-title { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 700; color: var(--primary); letter-spacing: -0.02em; }
.header-subtitle { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono); }
.header-actions { display: flex; align-items: center; gap: var(--space-3); }
.theme-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.theme-btn:hover { color: var(--text); border-color: var(--primary-border); background: var(--primary-glow); }

/* STATS BAR */
.stats-bar {
  background: var(--surface); border-bottom: 1px solid var(--divider);
  padding: var(--space-5) var(--space-6);
  display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: center;
}
.stat-item { display: flex; flex-direction: column; gap: var(--space-1); }
.stat-value { font-family: var(--font-mono); font-size: var(--text-xl); font-weight: 700; line-height: 1; }
.stat-value.green { color: var(--primary); }
.stat-value.red { color: var(--red); }
.stat-value.gold { color: var(--gold); }
.stat-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.progress-block { flex: 1; min-width: 200px; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }
.progress-bar {
  height: 6px; background: var(--surface-3); border-radius: var(--radius-full); overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary-dim), var(--primary));
  border-radius: var(--radius-full);
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 8px var(--primary-glow);
}

/* CONTROLS */
.controls {
  padding: var(--space-4) var(--space-6);
  display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--divider);
}
.search-box {
  flex: 1; min-width: 200px;
  padding: var(--space-2) var(--space-4);
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text);
  font-family: var(--font-mono); font-size: var(--text-sm);
  transition: all var(--transition);
}
.search-box:focus { outline: none; border-color: var(--primary-border); box-shadow: 0 0 0 3px var(--primary-glow); }
.search-box::placeholder { color: var(--text-faint); }
.filter-btn {
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface-2); color: var(--text-muted);
  font-size: var(--text-xs); font-family: var(--font-mono);
  cursor: pointer; transition: all var(--transition);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.filter-btn:hover { color: var(--text); border-color: var(--border); background: var(--surface-3); }
.filter-btn.active { background: var(--primary-glow); border-color: var(--primary-border); color: var(--primary); }

/* MAIN CONTENT */
.main { padding: var(--space-6); max-width: 1200px; margin: 0 auto; }

/* SECTION */
.section { margin-bottom: var(--space-10); }
.section-header {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4); padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--divider);
}
.section-icon { font-size: 1.25rem; }
.section-title { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 700; color: var(--text); }
.section-badge {
  margin-left: auto;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  background: var(--surface-3); border: 1px solid var(--border);
  font-size: var(--text-xs); font-family: var(--font-mono); color: var(--text-muted);
}
.section-badge span { color: var(--primary); font-weight: 600; }

/* CARDS GRID */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
  gap: var(--space-4);
}

/* LEVEL CARD */
.level-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  transition: all var(--transition); cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
}
.level-card:hover { box-shadow: var(--shadow-md); border-color: rgba(255,255,255,0.12); transform: translateY(-1px); }
.level-card.status-done { border-color: var(--primary-border); box-shadow: 0 0 0 1px var(--primary-border), var(--shadow-sm); }
.level-card.status-done:hover { box-shadow: 0 0 0 1px var(--primary-border), var(--shadow-md); }
.level-card.status-failed { border-color: var(--red-border); box-shadow: 0 0 0 1px var(--red-border), var(--shadow-sm); }
.level-card.status-failed:hover { box-shadow: 0 0 0 1px var(--red-border), var(--shadow-md); }
.level-card.hidden { display: none; }

.card-top {
  padding: var(--space-4);
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
}
.card-num {
  font-family: var(--font-mono); font-size: var(--text-xs);
  color: var(--text-faint); font-weight: 600; letter-spacing: 0.06em;
  background: var(--surface-3); border: 1px solid var(--divider);
  padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.card-status-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 3px;
  background: var(--border);
  transition: all var(--transition);
}
.status-done .card-status-dot { background: var(--primary); box-shadow: 0 0 6px var(--primary-glow); }
.status-failed .card-status-dot { background: var(--red); box-shadow: 0 0 6px var(--red-glow); }

.card-body { padding: 0 var(--space-4) var(--space-4); flex: 1; }
.card-name { font-family: var(--font-mono); font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-2); color: var(--text); }
.status-done .card-name { color: var(--primary); }
.status-failed .card-name { color: var(--red); }
.card-objective { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.55; }

/* CARD CONTROLS */
.card-footer {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--divider);
  display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap;
  background: var(--surface-2);
}
.status-toggle {
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full); font-size: var(--text-xs);
  font-family: var(--font-mono); font-weight: 600;
  cursor: pointer; border: 1px solid; transition: all var(--transition);
  letter-spacing: 0.04em;
}
.btn-done {
  background: var(--primary-glow); border-color: var(--primary-border); color: var(--primary);
}
.btn-done:hover { background: var(--primary); color: var(--text-inverse); }
.btn-failed {
  background: var(--red-glow); border-color: var(--red-border); color: var(--red);
}
.btn-failed:hover { background: var(--red); color: var(--text-inverse); }
.btn-reset {
  background: transparent; border-color: var(--border); color: var(--text-faint);
}
.btn-reset:hover { background: var(--surface-3); color: var(--text-muted); }
.writeup-badge {
  margin-left: auto;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm); font-size: var(--text-xs);
  font-family: var(--font-mono); font-weight: 600;
  background: var(--gold-glow); color: var(--gold);
  border: 1px solid rgba(251,191,36,0.25); cursor: default;
}

/* NOTES */
.card-notes {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--divider);
  display: none;
}
.card-notes.visible { display: block; }
.notes-textarea {
  width: 100%; min-height: 80px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text);
  font-family: var(--font-mono); font-size: var(--text-xs);
  padding: var(--space-3); resize: vertical;
  transition: border-color var(--transition);
}
.notes-textarea:focus { outline: none; border-color: var(--primary-border); }
.notes-textarea::placeholder { color: var(--text-faint); }
.notes-toggle { color: var(--text-faint); font-size: var(--text-xs); font-family: var(--font-mono); background: none; border: none; cursor: pointer; padding: 0; transition: color var(--transition); }
.notes-toggle:hover { color: var(--text-muted); }

/* EMPTY STATE */
.empty-state {
  grid-column: 1/-1; text-align: center; padding: var(--space-20) var(--space-8);
  color: var(--text-muted); font-family: var(--font-mono);
}
.empty-state .icon { font-size: 3rem; margin-bottom: var(--space-4); opacity: 0.4; }
.empty-state p { color: var(--text-faint); font-size: var(--text-sm); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

/* MOBILE */
@media (max-width: 640px) {
  .header { padding: var(--space-3) var(--space-4); }
  .stats-bar { padding: var(--space-4); gap: var(--space-4); }
  .controls { padding: var(--space-3) var(--space-4); }
  .main { padding: var(--space-4); }
  .header-subtitle { display: none; }
}

/* DONE ANIMATION */
@keyframes pulse-green { 0%,100%{box-shadow:0 0 0 0 var(--primary-glow)} 50%{box-shadow:0 0 0 6px transparent} }
.status-done { animation: pulse-green 0.4s ease; }
</style>
</head>

<script>

  {id:1, icon:"⚙️", title:"Part 2: EVM Architecture & Basic Flow Controls", range:[6,12]},
  {id:2, icon:"🔒", title:"Part 3: Advanced Gatekeepers & Token Standards", range:[13,19]},
  {id:3, icon:"📈", title:"Part 4: Complex DeFi Logic, Proxies & Edge Cases", range:[20,28]},
];

const STORAGE_KEY = 'ethernaut_tracker_v1';

function loadState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();
let currentFilter = 'all';
let searchQuery = '';

// Pre-mark levels 2-5 as done (writeups provided)
[2,3,4,5].forEach(id => {
  if (!state[id]) state[id] = {};
  if (!state[id].status) state[id].status = 'done';
});
saveState(state);

function getStatus(id) { return (state[id] && state[id].status) || 'open'; }
function getNotes(id) { return (state[id] && state[id].notes) || ''; }

function setStatus(id, status) {
  if (!state[id]) state[id] = {};
  state[id].status = status;
  saveState(state);
  renderAll();
}

function setNotes(id, notes) {
  if (!state[id]) state[id] = {};
  state[id].notes = notes;
  saveState(state);
}

function updateStats() {
  const done = LEVELS.filter(l => getStatus(l.id) === 'done').length;
  const failed = LEVELS.filter(l => getStatus(l.id) === 'failed').length;
  const pct = Math.round((done / LEVELS.length) * 100);
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-failed').textContent = failed;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function cardMatchesFilter(id) {
  const status = getStatus(id);
  if (currentFilter === 'done') return status === 'done';
  if (currentFilter === 'failed') return status === 'failed';
  if (currentFilter === 'open') return status === 'open';
  return true;
}

function cardMatchesSearch(level) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return level.name.toLowerCase().includes(q) ||
    level.objective.toLowerCase().includes(q) ||
    String(level.id).includes(q);
}

function renderAll() {
  updateStats();
  document.querySelectorAll('.level-card').forEach(card => {
    const id = parseInt(card.dataset.id);
    const level = LEVELS[id];
    const status = getStatus(id);
    card.className = 'level-card status-' + status;
    card.querySelector('.card-status-dot').className = 'card-status-dot';
    const hide = !cardMatchesFilter(id) || !cardMatchesSearch(level);
    if (hide) card.classList.add('hidden');
    card.querySelector('.card-name').textContent = 'Level ' + id + ': ' + level.name;
  });
  // Show/hide empty states per section
  PARTS.forEach(part => {
    const section = document.getElementById('section-' + part.id);
    if (!section) return;
    const grid = section.querySelector('.cards-grid');
    const visible = grid.querySelectorAll('.level-card:not(.hidden)').length;
    let empty = grid.querySelector('.empty-state');
    if (visible === 0) {
      if (!empty) {
        empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="icon">🔍</div><p>No levels match your filter.</p>';
        grid.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }
    // update section badge
    const [start, end] = part.range;
    const partLevels = LEVELS.filter(l => l.id >= start && l.id <= end);
    const partDone = partLevels.filter(l => getStatus(l.id) === 'done').length;
    const badge = section.querySelector('.section-badge');
    if (badge) badge.innerHTML = '<span>' + partDone + '</span>/' + partLevels.length;
  });
}

function buildUI() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  PARTS.forEach(part => {
    const [start, end] = part.range;
    const partLevels = LEVELS.filter(l => l.id >= start && l.id <= end);
    const section = document.createElement('section');
    section.className = 'section'; section.id = 'section-' + part.id;
    const partDone = partLevels.filter(l => getStatus(l.id) === 'done').length;
    section.innerHTML = `<div class="section-header">
      <span class="section-icon">${part.icon}</span>
      <span class="section-title">${part.title}</span>
      <span class="section-badge"><span>${partDone}</span>/${partLevels.length}</span>
    </div>`;
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    partLevels.forEach(level => {
      const status = getStatus(level.id);
      const notes = getNotes(level.id);
      const card = document.createElement('div');
      card.className = 'level-card status-' + status;
      card.dataset.id = level.id;
      card.innerHTML = `
        <div class="card-top">
          <span class="card-num">LVL-${String(level.id).padStart(2,'0')}</span>
          <div style="flex:1"></div>
          ${level.hasWriteup ? '<span class="writeup-badge" title="Writeup available">📄 writeup</span>' : ''}
          <div class="card-status-dot"></div>
        </div>
        <div class="card-body">
          <div class="card-name">Level ${level.id}: ${level.name}</div>
          <div class="card-objective">${level.objective}</div>
        </div>
        <div class="card-footer">
          <button class="status-toggle btn-done" onclick="event.stopPropagation();setStatus(${level.id},'done')">✓ Solved</button>
          <button class="status-toggle btn-failed" onclick="event.stopPropagation();setStatus(${level.id},'failed')">✗ Failed</button>
          <button class="status-toggle btn-reset" onclick="event.stopPropagation();setStatus(${level.id},'open')">Reset</button>
          <button class="notes-toggle" onclick="toggleNotes(${level.id},this)">+ notes</button>
        </div>
        <div class="card-notes ${notes ? 'visible' : ''}" id="notes-${level.id}">
          <textarea class="notes-textarea" placeholder="Add notes, tx hashes, exploit steps..."
            oninput="setNotes(${level.id},this.value)">${notes}</textarea>
        </div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    main.appendChild(section);
  });
  renderAll();
}

function renderAll() {
  updateStats();

  document.querySelectorAll('.level-card').forEach(card => {
    const id = parseInt(card.dataset.id, 10);
    const level = LEVELS.find(l => l.id === id);
    if (!level) return;

    const status = getStatus(id);
    card.className = 'level-card status-' + status;

    const hide = !cardMatchesFilter(id) || !cardMatchesSearch(level);
    if (hide) card.classList.add('hidden');

    const nameEl = card.querySelector('.card-name');
    if (nameEl) nameEl.textContent = 'Level ' + id + ': ' + level.name;
  });

  PARTS.forEach(part => {
    const section = document.getElementById('section-' + part.id);
    if (!section) return;

    const grid = section.querySelector('.cards-grid');
    if (!grid) return;

    const visible = grid.querySelectorAll('.level-card:not(.hidden)').length;
    let empty = grid.querySelector('.empty-state');

    if (visible === 0) {
      if (!empty) {
        empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="icon">🔍</div><p>No levels match your filter.</p>';
        grid.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }

    const [start, end] = part.range;
    const partLevels = LEVELS.filter(l => l.id >= start && l.id <= end);
    const partDone = partLevels.filter(l => getStatus(l.id) === 'done').length;
    const badge = section.querySelector('.section-badge');
    if (badge) badge.innerHTML = '<span>' + partDone + '</span>/' + partLevels.length;
  });
}

buildUI();
</script>
</body>
</html>
